services:
  web:
    build:
      context: ${TODO_APP_BUILD_CONTEXT:?Set TODO_APP_BUILD_CONTEXT to the repository root}
      dockerfile: backend/deploy/raspberry-pi/web/Dockerfile
    image: done-ish-web:local
    container_name: todo-web
    restart: unless-stopped
    networks:
      - todo-edge
    ports:
      - "127.0.0.1:4173:8080"
    depends_on:
      catalog-api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
