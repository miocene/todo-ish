services:
  catalog-api:
    build:
      context: ${TODO_APP_BUILD_CONTEXT:?Set TODO_APP_BUILD_CONTEXT to the repository root}/backend/api
    container_name: todo-catalog-api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: todo
      PGUSER: todo_runtime
      PGPASSWORD_FILE: /run/secrets/runtime_password
      PGPOOL_MAX: 4
      TZ: UTC
    secrets:
      - runtime_password
    networks:
      - todo-internal
      - todo-edge
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    image: postgres:18.6-bookworm
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: todo
      PGUSER: todo_migrator
      PGOPTIONS: -c role=todo_owner
      PGPASSWORD_FILE: /run/secrets/migrator_password
      MIGRATION_DIRECTORY: /migrations
      TZ: UTC
    entrypoint: ["/bin/sh", "/run-migrations.sh"]
    secrets:
      - migrator_password
    volumes:
      - type: bind
        source: ${TODO_APP_BUILD_CONTEXT:?Set TODO_APP_BUILD_CONTEXT to the repository root}/backend/database/migrations
        target: /migrations
        read_only: true
      - type: bind
        source: ${TODO_APP_BUILD_CONTEXT:?Set TODO_APP_BUILD_CONTEXT to the repository root}/backend/database/run-migrations.sh
        target: /run-migrations.sh
        read_only: true
    networks:
      - todo-internal
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  adminer:
    image: adminer:6.0.1-standalone
    container_name: todo-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      TZ: UTC
    networks:
      - todo-internal
      - todo-edge
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  todo-edge:
    name: todo-edge
    driver: bridge
