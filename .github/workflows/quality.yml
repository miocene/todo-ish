name: Quality checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.1, 24.19.0]
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            backend/api/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install application and tooling dependencies
        run: yarn setup --skip-browsers

      - name: Lint, format, test, and build
        run: yarn lint && yarn format:check && yarn test:unit && yarn test:api && yarn build

      - name: Measure JavaScript coverage
        if: matrix.node == '24.19.0'
        run: yarn test:coverage

      - name: Install Chromium for database browser integration tests
        run: yarn playwright install --with-deps chromium

      - name: Verify PostgreSQL round trips and backup restore
        run: yarn test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          TEST_BACKUP_CONTAINER: ${{ job.services.postgres.id }}

      - name: Verify web container build
        if: matrix.node == '24.19.0'
        run: docker build --file backend/deploy/raspberry-pi/web/Dockerfile --tag done-ish-web:ci .

      - name: Verify deployed API image and health/auth boundaries
        if: matrix.node == '24.19.0'
        run: |
          docker build --tag done-ish-api:ci backend/api
          node backend/api/test/container-smoke.mjs
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Save JavaScript coverage
        if: always() && matrix.node == '24.19.0'
        uses: actions/upload-artifact@v7
        with:
          name: javascript-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  browsers:
    name: Browser tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: webkit
            engine: webkit
          - project: mobile-safari
            engine: webkit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            backend/api/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install application dependencies
        run: |
          yarn install --frozen-lockfile
          yarn --cwd backend/api install --frozen-lockfile

      - name: Install browser and system dependencies
        run: yarn playwright install --with-deps ${{ matrix.engine }}

      - name: Run browser tests
        run: yarn test:e2e --project=${{ matrix.project }} --workers=2

      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
