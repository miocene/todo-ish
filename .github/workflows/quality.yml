name: Quality checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            backend/api/yarn.lock

      - name: Enable Yarn
        run: corepack enable

      - name: Install frontend and API dependencies
        run: |
          yarn install --frozen-lockfile
          yarn --cwd backend/api install --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python tools
        run: yarn setup:python

      - name: Install browser and system dependencies
        run: yarn playwright install --with-deps chromium

      - name: Lint, format, test, and build
        run: yarn quality

      - name: Verify PostgreSQL round trips
        run: yarn test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Verify web container build
        run: docker build --file backend/deploy/raspberry-pi/web/Dockerfile --tag done-ish-web:ci .

      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
